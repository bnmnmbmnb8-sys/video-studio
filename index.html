<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو الفيديو</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c4cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f3f8;--panel:#fff;--text:#16161d;--mut:#7a7a8c;--line:#e2e2ea;--acc:#6c4cff;--acc2:#fff;--chip:#ececf4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e13;--panel:#181820;--text:#f1f1f6;--mut:#8d8d9e;--line:#272731;--acc:#8b73ff;--chip:#23232d}}
:root[data-theme="dark"]{--bg:#0e0e13;--panel:#181820;--text:#f1f1f6;--mut:#8d8d9e;--line:#272731;--acc:#8b73ff;--chip:#23232d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden;max-width:560px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
h1{font-size:16px;margin:0;font-weight:700}
.pill{background:var(--acc);color:var(--acc2);border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;font-weight:600}
.pill:disabled{opacity:.35}
.stage{flex:1;min-height:0;margin:0 12px;background:#000;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
canvas{max-width:100%;max-height:100%;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#b5b5c4;text-align:center;padding:20px;font-size:14px}
.big{width:76px;height:76px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.7);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:15px}
.ov i{display:block;height:100%;width:0;background:var(--acc)}
.ov div{width:60%;height:6px;background:#444;border-radius:4px;overflow:hidden}
.tp{display:flex;align-items:center;gap:12px;padding:12px 16px 4px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:16px;flex:none}
.time{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;direction:ltr}
.tl{padding:6px 22px 10px}
.bar{position:relative;height:46px;background:var(--chip);border-radius:10px;direction:ltr;touch-action:none}
.sel{position:absolute;top:0;bottom:0;border:2px solid var(--acc);border-radius:10px;background:color-mix(in srgb,var(--acc) 22%,transparent);pointer-events:none}
.h{position:absolute;top:-4px;bottom:-4px;width:18px;margin-left:-9px;background:var(--acc);border-radius:6px}
.h::after{content:"";position:absolute;top:14px;bottom:14px;left:8px;width:2px;background:#fff;opacity:.8;border-radius:2px}
.ph{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:#ff4d6d;border-radius:2px;pointer-events:none}
.sheet{background:var(--panel);border-radius:22px 22px 0 0;padding:12px 14px 6px;border-top:1px solid var(--line);min-height:150px}
.pane{display:none}.pane.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);color:var(--text);border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px}
.chip.on{background:var(--acc);color:#fff}
.sl{display:flex;align-items:center;gap:10px;margin-top:6px}
.sl b{min-width:38px;text-align:center;font-size:13px;color:var(--mut)}
input[type=range]{flex:1;accent-color:var(--acc);height:30px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sm{font-size:12px;color:var(--mut);margin:8px 0 0}
nav{display:flex;background:var(--panel);padding:4px 8px 6px}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
nav button span{font-size:20px}
nav button.on{color:var(--acc);font-weight:700}

.bar{height:54px;overflow:visible}
.blks{position:absolute;inset:0;display:flex;border-radius:10px;overflow:hidden}
.blk{height:100%;background:color-mix(in srgb,var(--acc) 30%,var(--chip));border-left:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);min-width:0;overflow:hidden}
.blk:nth-child(even){background:color-mix(in srgb,var(--acc) 14%,var(--chip))}
.blk.on{outline:2px solid var(--acc);outline-offset:-2px}
.hd{display:flex;gap:8px}
.ic{width:38px;height:38px;border-radius:50%;border:0;background:var(--chip);color:var(--text);font-size:18px}
.ic:disabled{opacity:.3}
</style>
</head>
<body>
<header><h1>🎬 استوديو الفيديو</h1><div class="hd"><button class="ic" id="un" disabled>↶</button><button class="ic" id="re" disabled>↷</button><button class="pill" id="exp" disabled>تصدير</button></div></header>
<div class="stage">
  <canvas id="cv" width="640" height="360" hidden></canvas>
  <label class="empty" id="empty" for="file"><div class="big">＋</div>اضغط لاستيراد فيديو<small>يعمل على جهازك بدون رفع</small></label>
  <input id="file" type="file" accept="video/*" multiple hidden>
  <div class="ov" id="ov">جارٍ التصدير...<div><i id="pi"></i></div></div>
</div>
<div class="tp"><button class="play" id="play">▶</button><span class="time" id="time">0:00 / 0:00</span></div>
<div class="tl"><div class="bar" id="bar"><div class="blks" id="blks"></div><div class="h" id="hi" data-h="in"></div><div class="h" id="ho" data-h="out"></div><div class="ph" id="ph"></div></div></div>
<div class="sheet">
  <div class="pane on" id="p0"><div class="chips" id="presets"></div><div class="chips" id="params"></div><div class="sl"><input type="range" id="fs"><b id="fv"></b></div></div>
  <div class="pane" id="p1">
    <div class="chips"><label class="chip" for="file">＋ إضافة مقطع</label><button class="chip" id="split">✂ تقسيم هنا</button><button class="chip" id="dup">⧉ نسخ</button><button class="chip" id="del">🗑 حذف</button></div>
    <div class="chips"><button class="chip" id="mL">→ تقديم</button><button class="chip" id="mR">← تأخير</button></div>
    <p class="sm" id="trim"></p><p class="sm">المقطع الحالي هو الذي عليه المقبضان؛ اسحبهما للقص، واضغط على أي مكان في الشريط للانتقال.</p>
  </div>
  <div class="pane" id="p2"><input type="text" id="txt" placeholder="اكتب نصاً على الفيديو..."><div class="chips" id="sws" style="margin-top:10px"></div>
    <div class="sl"><span>الحجم</span><input type="range" id="ts" min="20" max="200" value="70"></div>
    <div class="sl"><span>أفقي</span><input type="range" id="tx" min="0" max="100" value="50"></div>
    <div class="sl"><span>رأسي</span><input type="range" id="ty" min="0" max="100" value="85"></div></div>
  <div class="pane" id="p3"><p class="sm" style="margin-top:0">السرعة</p><div class="chips" id="spd"></div><p class="sm">مستوى الصوت</p><div class="sl"><input type="range" id="vol" min="0" max="1" step="0.05" value="1"></div></div>
</div>
<nav id="nav"><button class="on"><span>✨</span>فلاتر</button><button><span>🎞️</span>مقاطع</button><button><span>🔤</span>نص</button><button><span>⚡</span>سرعة</button></nav>
<video id="vid" playsinline hidden></video>
<script>
const $=id=>document.getElementById(id),v=$('vid'),cv=$('cv'),ctx=cv.getContext('2d');
const F=[['brightness','السطوع',0,200,100,'%'],['contrast','التباين',0,200,100,'%'],['saturate','التشبع',0,300,100,'%'],['hue-rotate','اللون',0,360,0,'deg'],['blur','تمويه',0,10,0,'px'],['grayscale','أبيض وأسود',0,100,0,'%'],['sepia','سيبيا',0,100,0,'%']];
const P={'الأصلي':[100,100,100,0,0,0,0],'سينمائي':[95,125,85,0,0,0,15],'دافئ':[105,105,120,-10,0,0,30],'بارد':[100,105,110,15,0,0,0],'قديم':[95,110,70,0,0,0,80],'أبيض وأسود':[100,120,100,0,0,100,0]};
const val={};F.forEach(f=>val[f[0]]=f[4]);
let cur=0,tcol='#ffffff',clips=[],ci=0,playing=false,busy=false,exporting=false,fin=null,uid=1,lt=0,vol=1,hist=[],redo=[],ac,gn,dst;
function chipRow(el,items,cb,on){items.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{[...el.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');cb(i)};el.appendChild(b)});if(on!=null)el.children[on].classList.add('on')}
chipRow($('presets'),Object.keys(P),i=>{Object.values(P)[i].forEach((x,k)=>val[F[k][0]]=x);sl()});
chipRow($('params'),F.map(f=>f[1]),i=>{cur=i;sl()},0);
function sl(){const f=F[cur],s=$('fs');s.min=f[2];s.max=f[3];s.value=val[f[0]];$('fv').textContent=val[f[0]]}
$('fs').oninput=e=>{val[F[cur][0]]=e.target.value;$('fv').textContent=e.target.value};sl();
['#ffffff','#ffd60a','#ff4d6d','#30d5c8','#6c4cff','#000000'].forEach(c=>{const b=document.createElement('button');b.className='sw'+(c==tcol?' on':'');b.style.background=c;b.onclick=()=>{tcol=c;[...$('sws').children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('sws').appendChild(b)});
chipRow($('spd'),['0.25×','0.5×','1×','1.5×','2×'],i=>v.playbackRate=[.25,.5,1,1.5,2][i],2);
[...$('nav').children].forEach((b,i)=>b.onclick=()=>{[...$('nav').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.pane').forEach((p,k)=>p.classList.toggle('on',k==i))});
const fmt=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const starts=()=>{let a=0;return clips.map(c=>{const s=a;a+=c.o-c.i;return s})},total=()=>clips.reduce((a,c)=>a+c.o-c.i,0);
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const s=ac.createMediaElementSource(v);gn=ac.createGain();dst=ac.createMediaStreamDestination();s.connect(gn);gn.connect(ac.destination);gn.connect(dst);gn.gain.value=vol}ac.resume()}
$('vol').oninput=e=>{vol=+e.target.value;if(gn)gn.gain.value=vol;else v.volume=vol};
async function load(i,t){const k=++lt;busy=true;ci=i;const c=clips[i];if(v.dataset.u!==c.url){v.dataset.u=c.url;v.src=c.url;await new Promise(r=>v.onloadeddata=r);if(k!==lt)return}
 if(Math.abs(v.currentTime-t)>.02){v.currentTime=t;await new Promise(r=>{v.onseeked=r;setTimeout(r,500)});v.onseeked=null;if(k!==lt)return}
 busy=false;if(playing)v.play().catch(()=>{})}
function snap(){return JSON.stringify(clips)}
function push(){hist.push(snap());if(hist.length>50)hist.shift();redo=[]}
function restore(s){clips=JSON.parse(s);ci=Math.min(ci,Math.max(0,clips.length-1));if(clips.length){const c=clips[ci];if(v.dataset.u===c.url)load(ci,Math.min(Math.max(v.currentTime,c.i),c.o-.05));else load(ci,c.i)}else{playing=false;v.pause()}render()}
$('un').onclick=()=>{if(!hist.length)return;redo.push(snap());restore(hist.pop())};
$('re').onclick=()=>{if(!redo.length)return;hist.push(snap());restore(redo.pop())};
function meta(f){return new Promise(r=>{const u=URL.createObjectURL(f),t=document.createElement('video');t.preload='metadata';t.onloadedmetadata=()=>r({url:u,dur:t.duration,w:t.videoWidth,h:t.videoHeight});t.onerror=()=>r(null);t.src=u})}
$('file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;const first=!clips.length;push();let n=0;
 for(const f of fs){const m=await meta(f);if(!m)continue;clips.push({id:uid++,url:m.url,dur:m.dur,i:0,o:m.dur,w:m.w,h:m.h});n++}
 if(!n){hist.pop();return}
 if(first){cv.width=clips[0].w;cv.height=clips[0].h;ci=0;render();load(0,0)}else render()};
function render(){const has=clips.length,T=total();cv.hidden=!has;$('empty').hidden=!!has;$('exp').disabled=!has;$('un').disabled=!hist.length;$('re').disabled=!redo.length;
 $('blks').innerHTML='';clips.forEach((c,i)=>{const d=document.createElement('div');d.className='blk'+(i==ci?' on':'');d.style.width=(c.o-c.i)/T*100+'%';d.textContent=i+1;$('blks').appendChild(d)});
 $('hi').style.display=$('ho').style.display=$('ph').style.display=has?'block':'none'}
$('split').onclick=()=>{const c=clips[ci];if(!c)return;const t=v.currentTime;if(t>c.i+.2&&t<c.o-.2){push();clips.splice(ci+1,0,{...c,id:uid++,i:t});c.o=t;ci++;render();load(ci,t)}};
$('dup').onclick=()=>{const c=clips[ci];if(!c)return;push();clips.splice(ci+1,0,{...c,id:uid++});render()};
$('del').onclick=()=>{if(!clips.length)return;push();clips.splice(ci,1);if(clips.length){ci=Math.min(ci,clips.length-1);load(ci,clips[ci].i)}else{playing=false;v.pause()}render()};
const mv=d=>{const j=ci+d;if(j<0||j>=clips.length)return;push();[clips[ci],clips[j]]=[clips[j],clips[ci]];ci=j;render()};
$('mL').onclick=()=>mv(-1);$('mR').onclick=()=>mv(1);
function tick(){if(!playing||busy||!clips.length)return;const c=clips[ci];if(v.currentTime>=c.o-.04||v.ended){if(ci<clips.length-1)load(ci+1,clips[ci+1].i);else{playing=false;v.pause();if(exporting&&fin)fin();else load(0,clips[0].i)}}}
function draw(){
 if(clips.length&&v.readyState>=2){const W=cv.width,H=cv.height;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const s=Math.min(W/v.videoWidth,H/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;
  ctx.filter=F.map(f=>`${f[0]}(${val[f[0]]}${f[5]})`).join(' ');ctx.drawImage(v,(W-w)/2,(H-h)/2,w,h);ctx.filter='none';
  const t=$('txt').value;if(t){const z=H*$('ts').value/600;ctx.font=`bold ${z}px system-ui,sans-serif`;ctx.textAlign='center';ctx.fillStyle=tcol;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=z/8;const x=W*$('tx').value/100,y=H*$('ty').value/100;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)}}
 tick();
 if(clips.length){const T=total(),S=starts(),c=clips[ci],g=S[ci]+Math.max(0,Math.min(c.o-c.i,v.currentTime-c.i)),p=x=>x/T*100+'%';
  $('ph').style.left=p(g);$('hi').style.left=p(S[ci]);$('ho').style.left=p(S[ci]+c.o-c.i);$('time').textContent=fmt(g)+' / '+fmt(T);
  $('trim').textContent=`المقطع ${ci+1} من ${clips.length} — مدته ${(c.o-c.i).toFixed(1)} ث`}
 $('play').textContent=playing?'⏸':'▶';requestAnimationFrame(draw)}
const bar=$('bar');let drag=null,d0;
const bx=e=>{const r=bar.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))};
bar.onpointerdown=e=>{if(!clips.length)return;bar.setPointerCapture(e.pointerId);drag=e.target.dataset.h||'seek';if(drag!='seek'){push();const c=clips[ci];d0={x:bx(e),i:c.i,o:c.o}}pm(e)};
bar.onpointermove=e=>drag&&pm(e);bar.onpointerup=()=>{if(drag&&drag!='seek')render();drag=null};
function pm(e){const T=total();if(drag=='seek'){const g=bx(e)*T,S=starts();let i=clips.length-1;for(let k=0;k<clips.length;k++)if(g<S[k]+clips[k].o-clips[k].i){i=k;break}
  const t=clips[i].i+Math.min(clips[i].o-clips[i].i,g-S[i]);if(i!=ci){render()}load(i,t);return}
 const c=clips[ci],dt=(bx(e)-d0.x)*T;
 if(drag=='in'){c.i=Math.min(Math.max(0,d0.i+dt),c.o-.2);v.currentTime=c.i}else{c.o=Math.max(Math.min(c.dur,d0.o+dt),c.i+.2);v.currentTime=Math.max(c.i,c.o-.05)}
 let k=0;[...$('blks').children].forEach((d,j)=>{d.style.width=(clips[j].o-clips[j].i)/total()*100+'%'})}
$('play').onclick=()=>{if(!clips.length)return;audio();if(!playing){playing=true;const c=clips[ci];if(v.currentTime>=c.o-.05||v.currentTime<c.i)load(ci,c.i);else if(!busy)v.play().catch(()=>{})}else{playing=false;v.pause()}};
$('exp').onclick=async()=>{
 if(!window.MediaRecorder){alert('المتصفح لا يدعم التصدير');return}
 audio();exporting=true;playing=false;v.pause();$('ov').style.display='flex';await load(0,clips[0].i);
 const st=cv.captureStream(30);dst.stream.getAudioTracks().forEach(t=>st.addTrack(t));
 const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:8e6}:{}),ch=[];
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{clearInterval(iv);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:rec.mimeType}));a.download='video.'+(rec.mimeType.includes('mp4')?'mp4':'webm');a.click();exporting=false;fin=null;$('ov').style.display='none';load(0,clips[0].i)};
 fin=()=>setTimeout(()=>rec.stop(),200);rec.start();playing=true;v.play();
 const iv=setInterval(()=>{const c=clips[ci];if(!c)return;const g=starts()[ci]+Math.max(0,v.currentTime-c.i);$('pi').style.width=Math.min(100,g/total()*100)+'%'},150)};
draw();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
